<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gallery-container">
        <!-- Header -->
        <header class="gallery-header">
            <h1>Photo Gallery</h1>
            <p>Hover over images to see captions</p>
        </header>

        <!-- Gallery Grid -->
        <section class="gallery-grid">
            <!-- Image 1 -->
            <div class="gallery-item">
                <img src="https://via.placeholder.com/300x300?text=Mountain+View" alt="Mountain View">
                <div class="caption-overlay">
                    <p class="caption-text">Mountain View</p>
                </div>
            </div>

            <!-- Image 2 -->
            <div class="gallery-item">
                <img src="https://via.placeholder.com/300x300?text=Ocean+Sunset" alt="Ocean Sunset">
                <div class="caption-overlay">
                    <p class="caption-text">Ocean Sunset</p>
                </div>
            </div>

            <!-- Image 3 -->
            <div class="gallery-item">
                <img src="https://via.placeholder.com/300x300?text=Forest+Path" alt="Forest Path">
                <div class="caption-overlay">
                    <p class="caption-text">Forest Path</p>
                </div>
            </div>

            <!-- Image 4 -->
            <div class="gallery-item">
                <img src="https://via.placeholder.com/300x300?text=City+Lights" alt="City Lights">
                <div class="caption-overlay">
                    <p class="caption-text">City Lights</p>
                </div>
            </div>

            <!-- Image 5 -->
            <div class="gallery-item">
                <img src="https://via.placeholder.com/300x300?text=Desert+Dunes" alt="Desert Dunes">
                <div class="caption-overlay">
                    <p class="caption-text">Desert Dunes</p>
                </div>
            </div>

            <!-- Image 6 -->
            <div class="gallery-item">
                <img src="https://via.placeholder.com/300x300?text=Northern+Lights" alt="Northern Lights">
                <div class="caption-overlay">
                    <p class="caption-text">Northern Lights</p>
                </div>
            </div>

            <!-- Image 7 -->
            <div class="gallery-item">
                <img src="https://via.placeholder.com/300x300?text=Beach+Paradise" alt="Beach Paradise">
                <div class="caption-overlay">
                    <p class="caption-text">Beach Paradise</p>
                </div>
            </div>

            <!-- Image 8 -->
            <div class="gallery-item">
                <img src="https://via.placeholder.com/300x300?text=Waterfall" alt="Waterfall">
                <div class="caption-overlay">
                    <p class="caption-text">Waterfall</p>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
