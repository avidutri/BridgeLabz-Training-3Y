<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-shell">
        <header><p class="eyebrow">Assignment 7 / Q2</p><h1>Measure the space.</h1><p>Each box uses a different sizing strategy.</p></header>
        <section class="size-stage" aria-label="Height and width examples">
            <article class="size-box pixels"><h2>Pixels</h2><p>240px wide<br>180px tall</p></article>
            <article class="size-box fluid"><h2>Percent</h2><p>72% wide<br>min-height applied</p></article>
            <article class="size-box viewport"><h2>Viewport</h2><p>28vw wide<br>max-width applied</p><p class="overflow-copy">This sentence demonstrates overflow handling inside a constrained box.</p></article>
        </section>
    </main>
</body>
</html>
