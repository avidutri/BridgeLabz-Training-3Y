<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline and Focus Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="form-shell">
        <section class="intro"><p class="eyebrow">Assignment 7 / Q9</p><h1>Make contact.</h1><p>Focus each field to reveal its outline treatment.</p></section>
        <form action="#" method="post">
            <label for="name">Name<input id="name" name="name" type="text" required placeholder="Your name"></label>
            <label for="email">Email<input id="email" name="email" type="email" required placeholder="you@example.com"></label>
            <label for="message">Message<textarea id="message" name="message" rows="5" placeholder="Write a short note"></textarea></label>
            <button type="submit">Send message</button>
        </form>
    </main>
</body>
</html>
