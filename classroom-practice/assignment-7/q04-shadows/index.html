<body>
    <main class="page-shell">
        <header><p class="eyebrow">Assignment 7 / Q4</p><h1>Depth, in three moods.</h1><p>Hover a card to bring it forward.</p></header>
        <section class="card-row" aria-label="Profile cards with different shadows">
            <article class="profile-card soft"><span class="number">01</span><h2>Soft light</h2><p>A low, wide shadow creates a quiet floating effect.</p></article>
            <article class="profile-card crisp"><span class="number">02</span><h2>Crisp edge</h2><p>A compact shadow gives the card a precise, graphic edge.</p></article>
            <article class="profile-card colored"><span class="number">03</span><h2>Color cast</h2><p>A warm shadow can make depth feel energetic and tactile.</p></article>
        </section>
    </main>
