<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-shell">
        <header><p class="eyebrow">Assignment 7 / Q6</p><h1>Move the idea.</h1><p>Hover each tile to activate its transformation.</p></header>
        <section class="transform-row" aria-label="CSS transformation examples">
            <article class="transform-item"><div class="transform-box rotate">01</div><h2>Rotate</h2><p>rotate(12deg)</p></article>
            <article class="transform-item"><div class="transform-box scale">02</div><h2>Scale</h2><p>scale(1.16)</p></article>
            <article class="transform-item"><div class="transform-box translate">03</div><h2>Translate</h2><p>translateY(-18px)</p></article>
            <article class="transform-item"><div class="transform-box skew">04</div><h2>Skew</h2><p>skew(-12deg)</p></article>
        </section>
    </main>
</body>
</html>
