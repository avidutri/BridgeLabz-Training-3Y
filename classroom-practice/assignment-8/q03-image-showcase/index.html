<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Showcase</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <p class="label">Assignment 8 / Q3</p>
        <h1>Image Showcase</h1>
      </header>

      <section class="gallery" aria-label="Image gallery">
        <figure class="photo-card">
          <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Mountain lake" />
          <figcaption>Mountain Lake</figcaption>
        </figure>
        <figure class="photo-card">
          <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=900&q=80" alt="Forest trail" />
          <figcaption>Forest Trail</figcaption>
        </figure>
        <figure class="photo-card">
          <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80" alt="Ocean waves" />
          <figcaption>Ocean Waves</figcaption>
        </figure>
        <figure class="photo-card">
          <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=900&q=80" alt="Snowy landscape" />
          <figcaption>Snowy Valley</figcaption>
        </figure>
        <figure class="photo-card">
          <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Sunset cliffs" />
          <figcaption>Sunset Cliffs</figcaption>
        </figure>
        <figure class="photo-card">
          <img src="https://images.unsplash.com/photo-1521295121783-8a321d551ad2?auto=format&fit=crop&w=900&q=80" alt="City skyline" />
          <figcaption>City Lights</figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
