<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Tooltip Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <p class="label">Assignment 8 / Q2</p>
        <h1>Tooltip Demo</h1>
      </header>

      <section class="tooltip-row" aria-label="Tooltip examples">
        <div class="tooltip-wrap">
          <button type="button" class="icon-btn">?</button>
          <span class="tooltip">Helpful tooltip</span>
        </div>

        <div class="tooltip-wrap">
          <span class="tag">Hover me</span>
          <span class="tooltip">This tooltip is above the element</span>
        </div>

        <div class="tooltip-wrap">
          <button type="button" class="icon-btn success">i</button>
          <span class="tooltip">Information message</span>
        </div>
      </section>
    </main>
  </body>
</html>
