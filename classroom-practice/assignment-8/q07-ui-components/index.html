<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI Components</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card" aria-label="User interface components">
        <header class="card-header">
          <div>
            <p class="eyebrow">Workspace</p>
            <h1>Quick Actions</h1>
          </div>
          <button type="button" class="ghost-button">New</button>
        </header>

        <div class="toolbar">
          <label class="search-box" aria-label="Search">
            <span>Search</span>
            <input type="search" placeholder="Type to search..." />
          </label>

          <div class="actions">
            <button type="button" class="btn btn-primary">Save</button>
            <button type="button" class="btn btn-secondary">Cancel</button>
          </div>
        </div>

        <div class="controls">
          <label>
            <span>Project</span>
            <select>
              <option>Frontend Practice</option>
              <option>UI Challenge</option>
              <option>Learning Tasks</option>
            </select>
          </label>

          <button type="button" class="btn btn-outline">Share</button>
        </div>
      </section>
    </main>
  </body>
</html>
