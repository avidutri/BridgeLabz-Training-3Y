<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Styled Button Collection</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <p class="label">Assignment 8 / Q5</p>
        <h1>Button Collection</h1>
      </header>

      <section class="button-row" aria-label="Different button styles">
        <button type="button" class="btn btn-primary">Primary</button>
        <button type="button" class="btn btn-secondary">Secondary</button>
        <button type="button" class="btn btn-outline">Outline</button>
        <button type="button" class="btn btn-disabled" disabled>Disabled</button>
      </section>
    </main>
  </body>
</html>
