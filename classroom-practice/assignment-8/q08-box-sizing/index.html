<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box-Sizing Comparison</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <p class="label">Assignment 8 / Q8</p>
        <h1>Box-Sizing Comparison</h1>
      </header>

      <section class="comparison" aria-label="box sizing comparison">
        <article class="box-panel default-box">
          <h2>Content-Box</h2>
          <p>Default width includes only content, not padding and border.</p>
        </article>

        <article class="box-panel border-box">
          <h2>Border-Box</h2>
          <p>Width includes padding and border, making sizing more predictable.</p>
        </article>
      </section>
    </main>
  </body>
</html>
