<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Combined Effects</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <p class="label">Assignment 8 / Q9</p>
        <h1>Combined Effects</h1>
      </header>

      <section class="effects-grid" aria-label="Combined effects examples">
        <div class="effect-card">
          <h2>Scale</h2>
          <button type="button" class="demo-btn primary">Hover</button>
        </div>

        <div class="effect-card">
          <h2>Glow</h2>
          <button type="button" class="demo-btn accent">Focus</button>
        </div>

        <div class="effect-card">
          <h2>Lift</h2>
          <button type="button" class="demo-btn success">Action</button>
        </div>
      </section>
    </main>
  </body>
</html>
