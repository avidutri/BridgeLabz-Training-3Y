<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Pseudo-Classes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <p class="label">Assignment 8 / Q1</p>
        <h1>Pseudo-Class Demonstration</h1>
      </header>

      <section class="demo-row" aria-label="Examples of pseudo-class selectors">
        <div class="example-box">
          <h2>Links</h2>
          <p><strong>:hover</strong> and <strong>:focus</strong></p>
          <nav class="link-demo" aria-label="Link examples">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
          </nav>
        </div>

        <div class="example-box">
          <h2>Buttons</h2>
          <p><strong>:active</strong> and <strong>:focus</strong></p>
          <button class="demo-button" type="button">Click Me</button>
        </div>

        <div class="example-box">
          <h2>List Items</h2>
          <p><strong>:nth-child()</strong> pattern</p>
          <ul class="demo-list">
            <li>First</li>
            <li>Second</li>
            <li>Third</li>
            <li>Fourth</li>
            <li>Fifth</li>
          </ul>
        </div>
      </section>
    </main>
  </body>
</html>
