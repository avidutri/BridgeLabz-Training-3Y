<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Form</title>
</head>
<body>
    <!-- Payment fields are required for this practice form. -->
    <h1>Payment Details</h1>
    <form action="#" method="post">
        <p><label for="cardholder-name">Cardholder Name:</label> <input type="text" id="cardholder-name" name="cardholder-name" required></p>
        <p><label for="card-number">Card Number:</label> <input type="text" id="card-number" name="card-number" inputmode="numeric" required></p>
        <p><label for="expiry-date">Expiry Date:</label> <input type="month" id="expiry-date" name="expiry-date" required></p>
        <p><label for="cvv">CVV:</label> <input type="password" id="cvv" name="cvv" inputmode="numeric" required></p>
        <button type="submit">Pay Now</button>
    </form>
</body>
</html>
