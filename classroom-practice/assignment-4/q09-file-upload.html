<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Upload</title>
</head>
<body>
    <!-- The accept attribute limits the file picker to JPG and PNG images. -->
    <h1>Upload an Image</h1>
    <form action="#" method="post" enctype="multipart/form-data">
        <label for="image-file">Choose an image:</label>
        <input type="file" id="image-file" name="image-file" accept=".jpg,.png,image/jpeg,image/png">
        <button type="submit">Upload</button>
    </form>
    <p>Allowed files: JPG or PNG images only.</p>
</body>
</html>
