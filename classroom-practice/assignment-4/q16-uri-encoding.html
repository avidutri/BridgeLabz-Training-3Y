<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URI Encoding</title>
</head>
<body>
    <!-- Spaces and ampersands are encoded before being placed in a URI. -->
    <h1>URI Encoding Example</h1>
    <p>Encoded search link:</p>
    <a href="https://example.com/search?query=HTML%20%26%20CSS">Search for HTML &amp; CSS</a>
</body>
</html>
