<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback Form</title>
</head>
<body>
    <!-- Feedback form with a text area and radio-button rating. -->
    <h1>Share Your Feedback</h1>
    <form action="#" method="post">
        <p><label for="feedback">Feedback:</label><br><textarea id="feedback" name="feedback" rows="6" cols="40"></textarea></p>
        <fieldset>
            <legend>Rating</legend>
            <label><input type="radio" name="rating" value="good"> Good</label>
            <label><input type="radio" name="rating" value="average"> Average</label>
            <label><input type="radio" name="rating" value="poor"> Poor</label>
        </fieldset>
        <p><button type="submit">Submit Feedback</button></p>
    </form>
</body>
</html>
