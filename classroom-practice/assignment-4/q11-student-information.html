<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Information</title>
</head>
<body>
    <!-- Student information form with a default disabled course option. -->
    <h1>Student Information</h1>
    <form action="#" method="post">
        <p><label for="name">Name:</label> <input type="text" id="name" name="name" required></p>
        <p><label for="roll-number">Roll Number:</label> <input type="text" id="roll-number" name="roll-number" required></p>
        <p><label for="course">Course:</label>
            <select id="course" name="course" required>
                <option value="" disabled selected>Select Course</option>
                <option value="btech-cse">B.Tech Computer Science</option>
                <option value="bca">Bachelor of Computer Applications</option>
                <option value="bba">Bachelor of Business Administration</option>
            </select>
        </p>
        <button type="submit">Save Information</button>
    </form>
</body>
</html>
