<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Registration</title>
</head>
<body>
    <!-- All registration fields are required. -->
    <h1>User Registration</h1>
    <form action="#" method="post">
        <p><label for="full-name">Full Name:</label> <input type="text" id="full-name" name="full-name" required></p>
        <p><label for="email">Email Address:</label> <input type="email" id="email" name="email" required></p>
        <p><label for="password">Password:</label> <input type="password" id="password" name="password" required></p>
        <p><label for="confirm-password">Confirm Password:</label> <input type="password" id="confirm-password" name="confirm-password" required></p>
        <button type="submit">Register</button>
    </form>
</body>
</html>
