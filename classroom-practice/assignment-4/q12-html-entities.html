<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Entities</title>
</head>
<body>
    <!-- HTML entities display reserved characters and symbols safely. -->
    <h1>HTML Entity Examples</h1>
    <p>Less than: &lt; | Greater than: &gt; | Ampersand: &amp; | Double quote: &quot; | Apostrophe: &apos;</p>
    <p>Copyright: &copy; | Trademark: &trade; | Registered trademark: &reg;</p>
</body>
</html>
