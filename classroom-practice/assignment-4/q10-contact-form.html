<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
</head>
<body>
    <!-- Contact form with required fields and helpful placeholders. -->
    <h1>Contact Us</h1>
    <form action="#" method="post">
        <p><label for="name">Full Name:</label> <input type="text" id="name" name="name" placeholder="Enter your full name" required></p>
        <p><label for="email">Email:</label> <input type="email" id="email" name="email" placeholder="name@example.com" required></p>
        <p><label for="subject">Subject:</label> <input type="text" id="subject" name="subject" placeholder="Enter a subject" required></p>
        <p><label for="message">Message:</label><br><textarea id="message" name="message" rows="6" cols="40" placeholder="Write your message here" required></textarea></p>
        <button type="submit">Send Message</button>
    </form>
</body>
</html>
