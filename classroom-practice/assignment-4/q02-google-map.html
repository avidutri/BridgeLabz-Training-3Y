<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GLA University Map</title>
</head>
<body>
    <!-- Google Map for GLA University, Mathura -->
    <h1>Find GLA University</h1>
    <!-- loading="lazy" delays loading the map until it is near the visible area. -->
    <iframe
        src="https://www.google.com/maps?q=GLA+University+Mathura&output=embed"
        title="Google Map showing GLA University in Mathura"
        width="600"
        height="450"
        loading="lazy">
    </iframe>
</body>
</html>
