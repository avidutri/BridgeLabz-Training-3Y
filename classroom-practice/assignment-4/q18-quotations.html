<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Quotations</title>
</head>
<body>
    <!-- Blockquote is for a long quotation and q is for an inline quotation. -->
    <h1>Quotation Examples</h1>
    <blockquote cite="https://example.com/learning">Learning is a journey of discovery. Each question opens a new path, and every mistake teaches us how to improve &amp; continue.</blockquote>
    <p>My teacher often says, <q>Practice makes progress.</q></p>
</body>
</html>
