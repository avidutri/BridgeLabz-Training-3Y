<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Hover to Flip</h1>
        
        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-card-front">
                    <h2>CSS Card Flip</h2>
                    <div class="card-image">
                        <img src="https://via.placeholder.com/250x200?text=Card+Front" alt="Card Front">
                    </div>
                </div>
                <div class="flip-card-back">
                    <h2>What's Inside?</h2>
                    <p>
                        This is a beautiful card flip animation built with pure CSS using 3D transforms. 
                        Hover over the card to see the magic happen! It uses perspective and transform properties 
                        to create a smooth 3D rotation effect.
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
