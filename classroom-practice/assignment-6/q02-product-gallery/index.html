<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Gallery - CSS Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>Product Gallery</h1>
    </header>

    <main class="gallery-container">
        <div class="product-card">
            <div class="product-image">
                <img src="https://via.placeholder.com/200?text=Product+1" alt="Product 1">
            </div>
            <h3>Product 1</h3>
            <p class="price">$49.99</p>
        </div>

        <div class="product-card">
            <div class="product-image">
                <img src="https://via.placeholder.com/200?text=Product+2" alt="Product 2">
            </div>
            <h3>Product 2</h3>
            <p class="price">$59.99</p>
        </div>

        <div class="product-card">
            <div class="product-image">
                <img src="https://via.placeholder.com/200?text=Product+3" alt="Product 3">
            </div>
            <h3>Product 3</h3>
            <p class="price">$69.99</p>
        </div>

        <div class="product-card">
            <div class="product-image">
                <img src="https://via.placeholder.com/200?text=Product+4" alt="Product 4">
            </div>
            <h3>Product 4</h3>
            <p class="price">$79.99</p>
        </div>

        <div class="product-card">
            <div class="product-image">
                <img src="https://via.placeholder.com/200?text=Product+5" alt="Product 5">
            </div>
            <h3>Product 5</h3>
            <p class="price">$89.99</p>
        </div>

        <div class="product-card">
            <div class="product-image">
                <img src="https://via.placeholder.com/200?text=Product+6" alt="Product 6">
            </div>
            <h3>Product 6</h3>
            <p class="price">$99.99</p>
        </div>

        <div class="product-card">
            <div class="product-image">
                <img src="https://via.placeholder.com/200?text=Product+7" alt="Product 7">
            </div>
            <h3>Product 7</h3>
            <p class="price">$109.99</p>
        </div>

        <div class="product-card">
            <div class="product-image">
                <img src="https://via.placeholder.com/200?text=Product+8" alt="Product 8">
            </div>
            <h3>Product 8</h3>
            <p class="price">$119.99</p>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2024 Product Gallery. All rights reserved.</p>
    </footer>
</body>
</html>
