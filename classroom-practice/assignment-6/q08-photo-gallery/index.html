<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>Photo Gallery</h1>
        <p>Hover over images to zoom</p>
    </header>

    <div class="gallery">
        <figure class="gallery-item">
            <img src="https://via.placeholder.com/300x300?text=Photo+1" alt="Photo 1">
            <figcaption>Beautiful Landscape</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://via.placeholder.com/300x300?text=Photo+2" alt="Photo 2">
            <figcaption>Mountain View</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://via.placeholder.com/300x300?text=Photo+3" alt="Photo 3">
            <figcaption>Ocean Sunset</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://via.placeholder.com/300x300?text=Photo+4" alt="Photo 4">
            <figcaption>Forest Path</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://via.placeholder.com/300x300?text=Photo+5" alt="Photo 5">
            <figcaption>City Lights</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://via.placeholder.com/300x300?text=Photo+6" alt="Photo 6">
            <figcaption>Desert Dunes</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://via.placeholder.com/300x300?text=Photo+7" alt="Photo 7">
            <figcaption>Northern Lights</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://via.placeholder.com/300x300?text=Photo+8" alt="Photo 8">
            <figcaption>Tropical Beach</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://via.placeholder.com/300x300?text=Photo+9" alt="Photo 9">
            <figcaption>Snow Peak</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://via.placeholder.com/300x300?text=Photo+10" alt="Photo 10">
            <figcaption>Waterfall</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://via.placeholder.com/300x300?text=Photo+11" alt="Photo 11">
            <figcaption>Canyon View</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://via.placeholder.com/300x300?text=Photo+12" alt="Photo 12">
            <figcaption>Autumn Colors</figcaption>
        </figure>
    </div>

    <footer class="footer">
        <p>&copy; 2024 Photo Gallery. All rights reserved.</p>
    </footer>
</body>
</html>
