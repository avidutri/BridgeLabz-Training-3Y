<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Dashboard Summary</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="dashboard">
      <header class="header">
        <h1>Dashboard</h1>
      </header>

      <aside class="sidebar">

          <li>Overview</li>
          <li>Reports</li>
          <li>Guides</li>
          <li>Settings</li>
        </ul>

      <main class="main-content">
        <article class="card">
          <h3>Filters</h3>
          <p>Apply image and UI effects using CSS filters.</p>
        </article>
        <article class="card">
          <h3>Typography</h3>
          <p>Use <code>clamp()</code> to scale text responsively.</p>
        </article>
        <article class="card">
          <h3>Media Queries</h3>
          <p>Define breakpoints for different device sizes.</p>
        </article>
        <article class="card">
          <h3>Cheat Sheet</h3>
          <p>Review quick examples and implementation notes.</p>
        </article>
      </main>
    </div>

</html>
