<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <p class="eyebrow">Assignment 9 / Q1</p>
      <h1>Responsive Image Filter Gallery</h1>
    </header>

    <main>
      <section class="gallery" aria-label="Gallery of filtered images">
        <figure class="gallery-item">
          <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Blurred mountain lake" class="filter-blur" />
          <figcaption>Blur</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=900&q=80" alt="Forest with grayscale" class="filter-grayscale" />
          <figcaption>Grayscale</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80" alt="Beach in sepia tones" class="filter-sepia" />
          <figcaption>Sepia</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Sunset with brightness filter" class="filter-brightness" />
          <figcaption>Brightness</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=900&q=80" alt="Snow scene with contrast" class="filter-contrast" />
          <figcaption>Contrast</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="https://images.unsplash.com/photo-1521295121783-8a321d551ad2?auto=format&fit=crop&w=900&q=80" alt="City skyline with hue rotation" class="filter-hue" />
          <figcaption>Hue-Rotate</figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
