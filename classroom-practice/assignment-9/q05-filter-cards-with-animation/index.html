<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <p class="eyebrow">Assignment 9 / Q5</p>
      <h1>Filter Cards</h1>
    </header>

    <main class="card-row">
      <article class="profile-card">
        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=800&q=80" alt="Profile portrait" class="grayscale" />
        <div class="card-body">
          <h2>Emma</h2>
          <p>Creative director with a minimalist approach.</p>
        </div>
      </article>

      <article class="profile-card">
        <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=800&q=80" alt="Profile portrait" class="sepia" />
        <div class="card-body">
          <h2>Daniel</h2>
          <p>Product designer focused on clarity and flow.</p>
        </div>
      </article>

      <article class="profile-card">
        <img src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=800&q=80" alt="Profile portrait" class="grayscale" />
        <div class="card-body">
          <h2>Sophia</h2>
          <p>UX specialist blending research and storytelling.</p>
        </div>
      </article>
    </main>
  </body>
</html>
