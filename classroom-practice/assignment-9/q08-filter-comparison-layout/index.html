<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <p class="eyebrow">Assignment 9 / Q8</p>
      <h1>Filter Comparison</h1>
    </header>

    <main class="compare-layout">
      <figure class="image-box">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Original mountain scene" />
        <figcaption>Original</figcaption>
      </figure>

      <figure class="image-box">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Mountain scene with brightness filter" class="filtered" />
        <figcaption>Filtered</figcaption>
      </figure>
    </main>
  </body>
</html>
