<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Cards</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <p class="eyebrow">Assignment 9 / Q3</p>
      <h1>Responsive Cards</h1>

    <main class="card-layout">
      <article class="card-item">
        <h2>Card 1</h2>
        <p>Desktop layout keeps four cards balanced and clear.</p>
      </article>
      <article class="card-item">
        <h2>Card 2</h2>
        <p>Tablets reduce to two columns without shrinking content.</p>
      </article>
      <article class="card-item">
        <h2>Card 3</h2>
        <p>Mobile screens stack neatly for a readable experience.</p>
      </article>
      <article class="card-item">
        <h2>Card 4</h2>
        <p>Consistent padding and spacing keep the design clean.</p>
      </article>
    </main>
  </body>
