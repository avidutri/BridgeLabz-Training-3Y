<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Location Selection</title>
</head>
<body>
    <!-- Dropdown-based location selection -->
    <h1>Choose Your Travel Location</h1>
    <form action="#">
        <p><label for="country">Country:</label><select id="country" name="country"><option selected>India</option><option>Japan</option><option>France</option></select></p>
        <p><label for="state">State:</label><select id="state" name="state"><option selected>Uttar Pradesh</option><option>Rajasthan</option><option>Kerala</option></select></p>
        <p><label for="city">City:</label><select id="city" name="city"><option selected>Mathura</option><option>Agra</option><option>Lucknow</option></select></p>
        <p><label for="place">Favorite Tourist Place:</label><select id="place" name="place"><option selected>Vrindavan</option><option>Taj Mahal</option><option>Ayodhya</option></select></p>
    </form>
    <p>My selected choices are India, Uttar Pradesh, Mathura, and Vrindavan.</p>
</body>
</html>
