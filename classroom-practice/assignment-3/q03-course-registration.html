<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Registration</title>
</head>
<body>
    <!-- Course registration form -->
    <h1>Course Registration</h1>
    <form action="#" method="post">
        <fieldset>
            <legend>Student Details</legend>
            <p><label for="name">Full Name:</label> <input type="text" id="name" name="name" required></p>
            <p><label for="email">Email:</label> <input type="email" id="email" name="email" required></p>
            <p><label for="course">Select Course:</label>
                <select id="course" name="course"><option>Web Development</option><option>Data Structures</option><option>Database Systems</option></select>
            </p>
            <button type="submit">Register</button>
        </fieldset>
    </form>
    <h2>Available Course Schedules</h2>
    <table border="1">
        <thead><tr><th>Day</th><th>Time</th><th>Instructor</th></tr></thead>
        <tbody><tr><td>Monday</td><td>10:00 AM</td><td>Ms. Sharma</td></tr><tr><td>Wednesday</td><td>2:00 PM</td><td>Mr. Verma</td></tr><tr><td>Friday</td><td>11:00 AM</td><td>Dr. Singh</td></tr></tbody>
    </table>
</body>
</html>
