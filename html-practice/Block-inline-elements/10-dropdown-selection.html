<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Selection</title>
</head>
<body>

    <h1>Travel Selection Page</h1>

    <form>

        <!-- Country -->
        <label for="country">Country:</label>

        <select id="country" name="country">

            <option selected>India</option>
            <option>Japan</option>
            <option>France</option>
            <option>Australia</option>

        </select>

        <br><br>

        <!-- State -->
        <label for="state">State:</label>

        <select id="state" name="state">

            <option selected>Uttar Pradesh</option>
            <option>Bihar</option>
            <option>Rajasthan</option>
            <option>Maharashtra</option>

        </select>

        <br><br>

        <!-- City -->
        <label for="city">City:</label>

        <select id="city" name="city">

            <option selected>Mathura</option>
            <option>Agra</option>
            <option>Lucknow</option>
            <option>Varanasi</option>

        </select>

        <br><br>

        <!-- Tourist Place -->
        <label for="place">
            Favorite Tourist Place:
        </label>

        <select id="place" name="place">

            <option selected>Vrindavan</option>
            <option>Taj Mahal</option>
            <option>Jaipur</option>
            <option>Gateway of India</option>

        </select>

    </form>

    <h2>My Choices</h2>

    <table border="1">

        <tr>
            <th>Category</th>
            <th>Selected Choice</th>
        </tr>

        <tr>
            <td>Country</td>
            <td>India</td>
        </tr>

        <tr>
            <td>State</td>
            <td>Uttar Pradesh</td>
        </tr>

        <tr>
            <td>City</td>
            <td>Mathura</td>
        </tr>

        <tr>
            <td>Favorite Tourist Place</td>
            <td>Vrindavan</td>
        </tr>

    </table>

</body>
</html>
