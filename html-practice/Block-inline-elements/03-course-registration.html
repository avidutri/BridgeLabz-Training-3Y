<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Registration</title>
</head>
<body>

    <h1>Course Registration Form</h1>

    <form>

        <fieldset>

            <legend>Personal Information</legend>

            <label for="name">Name:</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
            >

            <br><br>

            <label for="email">Email:</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
            >

        </fieldset>

        <br>

        <fieldset>

            <legend>Course Information</legend>

            <label for="course">Select Course:</label>

            <select id="course" name="course">

                <option value="java">
                    Java Programming
                </option>

                <option value="python" selected>
                    Python Programming
                </option>

                <option value="web">
                    Web Development
                </option>

                <option value="ds">
                    Data Science
                </option>

                <option value="ml">
                    Machine Learning
                </option>

            </select>

        </fieldset>

        <br>

        <input type="submit" value="Register">

    </form>

    <h2>Available Course Schedules</h2>

    <table border="1">

        <thead>
            <tr>
                <th>Day</th>
                <th>Time</th>
                <th>Instructor</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Monday</td>
                <td>10:00 AM - 12:00 PM</td>
                <td>Mr. Sharma</td>
            </tr>

            <tr>
                <td>Wednesday</td>
                <td>02:00 PM - 04:00 PM</td>
                <td>Ms. Singh</td>
            </tr>

            <tr>
                <td>Friday</td>
                <td>11:00 AM - 01:00 PM</td>
                <td>Mr. Verma</td>
            </tr>
        </tbody>

    </table>

</body>
</html>
