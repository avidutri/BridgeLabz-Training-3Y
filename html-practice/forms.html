<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <form>

        <label for="name">Name: </label>
        <input id="name" type="text" placeholder="Enter Your Name:" name="name">

        <br>
        <br>

        <label for="email">Email:</label>
        <input id="email" type="email" placeholder="Enter ur email:" name="email">

        <br>
        <br>

        <label for="phone">Phone No</label>
        <input id="phone" type="number" placeholder="Enter your number" name="phone">
        <br>
        <br>

        <label for="pass">Password: </label>
        <input id="pass" type="password" name="password">

        <br>
        <br>

        <label>Skill: </label>
        <select name="skill">
            <option value="Html">Html</option>
            <option value="CSS">CSS</option>
            <option value="JS">JS</option>
        </select>


        <section>

            <label>Gender: </label>
            <input id="male" type="radio" name="Gender" value="male">
            <label for="male">male</label>
            <input id="female" type="radio" name="Gender"  value="female">
            <label for="female">Female</label>
            <input id="others" type="radio" name="Gender"  value="others">
            <label for="others">Others</label>
        </section>

        <section name="Skill">

            <label>Skill: </label>
            <input id="HTML" type="checkbox" name="Html" value="Html">
            <label for="HTML">html</label>
            <input id="CSS" type="checkbox" name="CSS" value="CSS">
            <label for="CSS">CSS</label>
            <input id="Js" type="checkbox" name="JS" value="Js">
            <label for="JS">JS</label>
            <input id="Mongodb" type="checkbox" name="Mongodb" value="Mongodb"> 
            <label for="Mongodb">Mongodb</label>
        </section>

        <br>
        <label for="date">Date</label>
        <input id="date" type="date" name="date">
        <textarea></textarea>

        <br>

        <input type="file" name="file"><br>
        <input type="range" max="3">

        <br>
        <br>
        <button type="submit">Submit</button>

        

    

    </form>
</body>
</html>
