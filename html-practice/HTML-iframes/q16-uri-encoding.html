<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URI Encoding</title>
</head>
<body>
    <h1>URI Encoding Example</h1>

    <!-- Spaces are encoded using %20 -->

    <a href="https://example.com/search?query=HTML%20%26%20CSS">
        search for HTML &amp; CSS
    </a>

    <p>
        Encoded URL: https://example.com/search?query=HTML%20%26%20CSS
    </p>
</body>
</html>
