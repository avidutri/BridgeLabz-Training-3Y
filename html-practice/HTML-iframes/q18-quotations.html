<!DOCTYPE html>
<html lang="en">

    <title>Quotations</title>
</head>
<body>
    <h1>HTML Quotations</h1>

    <!-- Long Quotations-->

    <blockquote>
        Learning HTML is an important first step in web development.
        HTML provides the structure of a webpage and helps us understand
        how different elements are organized. We can use &amp; to display
        special characters safely in HTML.

    <p>
        My teacher always says, <q>Practice make you better.</q>
    </p>
