<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Upload</title>
</head>
<body>

    <h1>File Upload Form</h1>

    <form>
        <label for="file">Choose a file:</label>
        <input
            type="file"
            id="file"
            name="file"
            accept=".jpg,.png">

        <br><br>

        <p>Only JPG and PNG image files are allowed.</p>

        <button type="submit">Upload</button>
    </form>

</body>
</html>
