<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Page</title>
</head>
<body>
    <h1>Simple Form</h1>

    <!-- Form submits result.html into the iframe -->

    <form action="result.html" target="resultFrame">


        <label for="name">Name:</label>
        <input type="text" id="name" name="name">

        <button type="submit">Submit</button>

    </form>

    <br>

    <!-- Result page will be loaded here after submission -->
     <iframe
        name="resultFrame"
        width="500"
        height="200"
        title="Form Result">
    </iframe>
</body>
</html>
