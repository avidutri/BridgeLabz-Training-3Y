<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<head>
    <!-- title defines the title shown in the browser tab -->
    <title>Important Head Elements</title>

    <!-- meta charset defines the character encoding -->
    <meta charset="UTF-8">

    <!-- meta description provides a description of the webpage -->
    <meta
        name="description"
        content="A webpage demonstrating important HTML head elements">

    <!-- meta author specifies the author of the webpage -->
    <meta
        name="author"
        content="Binit Kumar">

    <!-- base sets the base URL for relative links -->
    <base href="https://example.com/">

    <!-- link connects an external resource such as a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- style contains CSS rules; kept empty as instructed -->
    <style>
    </style>

    <!-- script contains JavaScript; kept empty as instructed -->
    <script>
    </script>
</head>
<body>
    
     <h1>Important Head Elements</h1>

    <p>
        This webpage demonstrates important elements used inside the head section.
    </p>
</body>
</html>
