<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Frameset Website</title>
</head>

<!-- Frameset divides the page into top and bottom frames -->
<frameset rows="30%,70%">

    <!-- Top frame contains navigation links -->
    <frame src="navigation.html" title="Navigation">

    <!-- Bottom frame displays welcome message -->
    <frame src="welcome.html" title="Welcome">

</frameset>

</html>
