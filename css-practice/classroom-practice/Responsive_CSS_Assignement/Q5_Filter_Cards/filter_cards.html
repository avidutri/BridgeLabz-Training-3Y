<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards</title>
    <link rel="stylesheet" href="filter_cards.css">
</head>
<body>

    <header>
        <h1>Profile Cards</h1>
    </header>

    <main>
        <section class="profiles">

            <article class="profile-card">
                <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=600&q=80"
                     alt="Profile">
                <h2>Alex Morgan</h2>
                <p>Web Developer</p>
            </article>

            <article class="profile-card">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=600&q=80"
                     alt="Profile">
                <h2>Emma Wilson</h2>
                <p>UI Designer</p>
            </article>

            <article class="profile-card">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=600&q=80"
                     alt="Profile">
                <h2>David Lee</h2>
                <p>Data Analyst</p>
            </article>

        </section>
    </main>

</body>
</html>
