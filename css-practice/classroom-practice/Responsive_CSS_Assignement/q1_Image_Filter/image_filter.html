<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Filter Gallery</title>
    <link rel="stylesheet" href="image_filter.css">
</head>
<body>

    <header>
        <h1>Responsive Image Filter Gallery</h1>
        <p>Different CSS filters applied to different images</p>
    </header>

    <main>
        <section class="gallery">

            <figure class="gallery-item">
                <img class="blur" 
                     src="https://images.unsplash.com/photo-1500530857726-4f5e1c6f5e8f?auto=format&fit=crop&w=800&q=80"
                     alt="Nature">
                <figcaption>Blur Effect</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="grayscale"
                     src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80"
                     alt="Mountain">
                <figcaption>Grayscale Effect</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="sepia"
                     src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80"
                     alt="Landscape">
                <figcaption>Sepia Effect</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="brightness"
                     src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80"
                     alt="Beach">
                <figcaption>Brightness Effect</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="contrast"
                     src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=800&q=80"
                     alt="Forest">
                <figcaption>Contrast Effect</figcaption>
            </figure>

            <figure class="gallery-item">
                <img class="hue"
                     src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=800&q=80"
                     alt="Nature">
                <figcaption>Hue Rotate Effect</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>Responsive CSS Assignment - Q1</p>
    </footer>

</body>
</html>
