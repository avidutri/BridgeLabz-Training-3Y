<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="gallery-page">

        <h1>My Photo Gallery</h1>

        <div class="gallery">

            <div class="photo">
                <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80" alt="Mountain">
                <div class="caption">Beautiful Mountain</div>
            </div>

            <div class="photo">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Beach">
                <div class="caption">Peaceful Beach</div>
            </div>

            <div class="photo">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80" alt="Lake">
                <div class="caption">Beautiful Lake</div>
            </div>

            <div class="photo">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80" alt="Forest">
                <div class="caption">Green Forest</div>
            </div>

            <div class="photo">
                <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=800&q=80" alt="Nature">
                <div class="caption">Nature View</div>
            </div>

            <div class="photo">
                <img src="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=800&q=80" alt="Trees">
                <div class="caption">Beautiful Trees</div>
            </div>

        </div>

    </main>

</body>
</html>
