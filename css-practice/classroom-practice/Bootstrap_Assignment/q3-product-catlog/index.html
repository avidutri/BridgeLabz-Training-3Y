<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Catalog</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="products.css">
</head>

<body>

<header class="bg-dark text-white py-4">
    <div class="container text-center">
        <h1 class="fw-bold">TechStore</h1>
        <p class="mb-0">Latest Technology Products</p>
    </div>
</header>

<main>

<section class="container py-5">

    <div class="text-center mb-5">
        <h2 class="fw-bold">Our Products</h2>
        <p class="text-muted">
            Explore our latest collection of technology products.
        </p>
    </div>

    <div class="row g-4">

        <!-- col-md-3 = 4 columns on medium and larger screens -->
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card product-card shadow-sm h-100">

                <img src="https://images.unsplash.com/photo-1517336714739-489689fd1ca8?auto=format&fit=crop&w=600&q=80"
                     class="card-img-top"
                     alt="Laptop">

                <div class="card-body text-center">
                    <h5 class="card-title">Laptop Pro</h5>
                    <p class="fw-bold">₹65,999</p>
                    <button class="btn btn-primary">
                        Add to Cart
                    </button>
                </div>

            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card product-card shadow-sm h-100">

                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80"
                     class="card-img-top"
                     alt="Smart Watch">

                <div class="card-body text-center">
                    <h5 class="card-title">Smart Watch</h5>
                    <p class="fw-bold">₹4,999</p>
                    <button class="btn btn-primary">
                        Add to Cart
                    </button>
                </div>

            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card product-card shadow-sm h-100">

                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80"
                     class="card-img-top"
                     alt="Headphones">

                <div class="card-body text-center">
                    <h5 class="card-title">Headphones</h5>
                    <p class="fw-bold">₹2,499</p>
                    <button class="btn btn-primary">
                        Add to Cart
                    </button>
                </div>

            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card product-card shadow-sm h-100">

                <img src="https://images.unsplash.com/photo-1609592424753-7b5e4e5e8e5c?auto=format&fit=crop&w=600&q=80"
                     class="card-img-top"
                     alt="Smartphone">

                <div class="card-body text-center">
                    <h5 class="card-title">Smartphone</h5>
                    <p class="fw-bold">₹29,999</p>
                    <button class="btn btn-primary">
                        Add to Cart
                    </button>
                </div>

            </div>
        </div>

    </div>

</section>

</main>

<footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">© 2026 TechStore</p>
</footer>

</body>
</html>
