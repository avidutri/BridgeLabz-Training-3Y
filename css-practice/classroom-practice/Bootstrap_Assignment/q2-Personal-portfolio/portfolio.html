<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="portfolio.css">
</head>

<body>

<header class="bg-dark text-white text-center p-5">
    <div class="container">
        <h1 class="fw-bold">Binit Kumar</h1>
        <p class="lead">B.Tech CSE | Aspiring Data Scientist</p>
    </div>
</header>

<main>

    <section class="container text-center mt-4">

        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=400&q=80"
             class="img-fluid rounded-circle profile-image"
             alt="Profile">

        <h2 class="mt-4 fw-bold">Hello, I'm Binit</h2>

        <p class="text-dark">
            I am a Computer Science student interested in Data Science,
            Machine Learning and software development.
        </p>

        <div class="mt-4">
            <a href="#contact" class="btn btn-primary me-2">
                Hire Me
            </a>

            <a href="#" class="btn btn-outline-dark">
                Download CV
            </a>
        </div>

    </section>

    <section id="contact" class="container bg-light p-5 mt-5 mb-5">

        <h2 class="text-center fw-bold mb-3">Contact Me</h2>

        <form>

            <div class="mb-3">
                <label class="form-label">Your Name</label>
                <input type="text" class="form-control"
                       placeholder="Enter your name">
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control"
                       placeholder="Enter your email">
            </div>

            <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea class="form-control"
                          rows="4"
                          placeholder="Write your message"></textarea>
            </div>

            <button type="submit" class="btn btn-dark">
                Send Message
            </button>

        </form>

    </section>

</main>

<footer class="bg-dark text-white text-center p-3">
    <p class="mb-0">© 2026 Binit Kumar | Personal Portfolio</p>
</footer>

</body>
</html>
