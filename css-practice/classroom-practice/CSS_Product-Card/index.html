<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <!-- Top Image Area -->
        <div class="image-box">

            <div class="top-row">
                <span class="discount">20% OFF</span>
                <span class="heart">♡</span>
            </div>

            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8c2hvZXN8ZW58MHx8MHx8fDA%3D" alt="Running Shoes">

        </div>


        <!-- Product Details -->
        <div class="details">

            <p class="category">SPORTS SHOES</p>

            <h2>Premium Running Shoes</h2>

            <div class="rating">
                <span>★★★★★</span>
                <p>(120)</p>
            </div>

            <div class="price">
                <h3>₹1,999</h3>
                <p>₹2,499</p>
            </div>

            <button>Add to Cart</button>

        </div>

    </div>

</body>
</html>
