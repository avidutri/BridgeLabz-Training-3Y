<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

```
<header>
    <h1>Image Showcase</h1>
    <p>Hover over each image to see the effect</p>
</header>

<main class="gallery">

    <!-- Image 1 -->
    <figure class="card">
        <div class="image-container">
            <img src="https://images.unsplash.com/photo-1692912364084-97b9ae31a8e1?auto=format&fit=crop&w=800&q=80" alt="Mountain Lake">
            <div class="overlay"></div>
        </div>
        <figcaption>Mountain Lake</figcaption>
    </figure>

    <!-- Image 2 -->
    <figure class="card">
        <div class="image-container">
            <img src="https://images.unsplash.com/photo-1745544377336-b95d172463be?auto=format&fit=crop&w=800&q=80" alt="Happy Dog">
            <div class="overlay"></div>
        </div>
        <figcaption>Happy Dog</figcaption>
    </figure>

    <!-- Image 3 -->
    <figure class="card">
        <div class="image-container">
            <img src="https://images.unsplash.com/photo-1554213808-9c5bab0f624e?auto=format&fit=crop&w=800&q=80" alt="Sunset Beach">
            <div class="overlay"></div>
        </div>
        <figcaption>Sunset Beach</figcaption>
    </figure>

    <!-- Image 4 -->
    <figure class="card">
        <div class="image-container">
            <img src="https://images.unsplash.com/photo-1662948391946-ab57966b3b8f?auto=format&fit=crop&w=800&q=80" alt="Butterfly Flower">
            <div class="overlay"></div>
        </div>
        <figcaption>Butterfly Flower</figcaption>
    </figure>

    <!-- Image 5 -->
    <figure class="card">
        <div class="image-container">
            <img src="https://images.unsplash.com/photo-1500730916581-3650001b0d92?auto=format&fit=crop&w=800&q=80" alt="City View">
            <div class="overlay"></div>
        </div>
        <figcaption>City View</figcaption>
    </figure>

    <!-- Image 6 -->
    <figure class="card">
        <div class="image-container">
            <img src="https://images.unsplash.com/photo-1774333670728-72df7742022b?auto=format&fit=crop&w=800&q=80" alt="Forest Path">
            <div class="overlay"></div>
        </div>
        <figcaption>Forest Path</figcaption>
    </figure>

</main>

<footer>
    <p>Responsive Image Showcase</p>
</footer>
```

</body>
</html>
