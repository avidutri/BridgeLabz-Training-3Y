<!DOCTYPE html>

<html lang="en">

```
<header>
    <h1>Combined Effects Demonstration</h1>
</header>

<main class="effects">

    <section class="effect-card">
        <button>Hover Me</button>
        <p>Hover changes color and size.</p>
    </section>

    <section class="effect-card">
        <button>Click Me</button>
        <p>Active effect appears while clicking.</p>
    </section>

    <section class="effect-card">
        <button>Focus Me</button>
        <p>Focus effect appears when selected.</p>
    </section>

</main>

<footer>
    <p>Pseudo-Classes + Transitions + Transformations</p>
</footer>
```
