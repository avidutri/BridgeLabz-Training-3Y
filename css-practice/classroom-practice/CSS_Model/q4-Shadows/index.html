<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Depth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Shadows and Depth Effects</h1>
        <p>Different box-shadow and text-shadow effects</p>
    </header>

    <main>
        <section class="card-container">

            <article class="card shadow-one">
                <h2>Soft Shadow</h2>
                <p>A soft shadow creates a clean and simple depth effect.</p>
            </article>

            <article class="card shadow-two">
                <h2>Deep Shadow</h2>
                <p>A stronger shadow creates more visual depth.</p>
            </article>

            <article class="card shadow-three">
                <h2>Glow Shadow</h2>
                <p>This card uses a colorful shadow effect.</p>
            </article>

        </section>
    </main>

    <footer>
        <p>CSS Practice - Shadows and Depth</p>
    </footer>

</body>
</html>
