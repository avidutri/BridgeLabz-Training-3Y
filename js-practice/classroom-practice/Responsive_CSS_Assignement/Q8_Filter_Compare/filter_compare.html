<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison</title>
    <link rel="stylesheet" href="filter_compare.css">
</head>
<body>

    <header>
        <h1>Before and After Filter</h1>
    </header>

    <main>
        <section class="comparison">

            <figure class="image-box">
                <img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=800&q=80"
                     alt="Original landscape">
                <figcaption>Before - Original Image</figcaption>
            </figure>

            <figure class="image-box filtered">
                <img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=800&q=80"
                     alt="Filtered landscape">
                <figcaption>After - Filter Applied</figcaption>
            </figure>

        </section>
    </main>

</body>
</html>
