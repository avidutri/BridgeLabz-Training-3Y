<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Fixed Header -->
    <header class="header">
        <h1>My Dashboard</h1>
    </header>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">

            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Profile</a>
                <a href="#">Projects</a>
                <a href="#">Messages</a>
                <a href="#">Settings</a>
            </nav>

        </aside>

        <!-- Main Content -->
        <main class="content">

            <h2>Dashboard Overview</h2>

            <div class="boxes">

                <section class="box">
                    <h3>Total Projects</h3>
                    <p>24</p>
                    <span>Projects completed</span>
                </section>

                <section class="box">
                    <h3>Students</h3>
                    <p>156</p>
                    <span>Active students</span>
                </section>

                <section class="box">
                    <h3>Tasks</h3>
                    <p>48</p>
                    <span>Tasks completed</span>
                </section>

                <section class="box">
                    <h3>Messages</h3>
                    <p>18</p>
                    <span>New messages</span>
                </section>

            </div>

        </main>

    </div>

</body>
</html>
