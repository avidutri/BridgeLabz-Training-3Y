<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Advanced CSS Selectors</h1>
    </header>

    <main>

        <section class="selector-section">

            <h2>Attribute Selectors</h2>

            <input type="text" placeholder="Text input">
            <input type="email" placeholder="Email input">

            <div class="links">
                <a href="https://www.google.com">HTTPS Link</a>
                <a href="http://example.com">HTTP Link</a>
            </div>

            <h2>List with Pseudo-classes</h2>

            <ul class="items">
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>Java</li>
                <li>Python</li>
            </ul>

            <div class="combinator-demo">
                <h2>Combinators</h2>

                <div class="parent">
                    <p>Descendant paragraph</p>

                    <section>
                        <p>Nested paragraph</p>
                    </section>

                    <p>Sibling paragraph</p>
                    <p>Another sibling paragraph</p>
                </div>
            </div>

        </section>

    </main>

    <footer>
        <p>CSS Practice - Advanced Selectors</p>
    </footer>

</body>
</html>
