<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Background</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CSS Gradient Backgrounds</h1>
    </header>

    <main>

        <!-- Linear gradient section -->
        <section class="gradient-section linear">
            <div class="content">
                <h2>Linear Gradient</h2>
                <p>This section uses a linear-gradient background.</p>
            </div>
        </section>

        <!-- Radial gradient section -->
        <section class="gradient-section radial">
            <div class="content">
                <h2>Radial Gradient</h2>
                <p>This section uses a radial-gradient background.</p>
            </div>
        </section>

    </main>

    <footer>
        <p>CSS Practice - Gradient Backgrounds</p>
    </footer>

</body>
</html>
